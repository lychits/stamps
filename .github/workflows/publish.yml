name: Publish stamp catalogue

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: stamp-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate and stage repository files
        run: python3 publication/stage.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy public catalogue
        id: deployment
        uses: actions/deploy-pages@v4
