name: Publish stamp catalogue

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: stamp-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Restore and verify catalogue files
        run: python3 publication/restore.py
      - name: Save catalogue and photographs in this repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets index.html catalog.json catalogue-offline.zip research-report.md catalog-source.json Deep_Research_Report.md
          if ! git diff --cached --quiet; then
            git commit -m "Import verified catalogue and photographs (477 specimens)"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy public catalogue
        id: deployment
        uses: actions/deploy-pages@v4
